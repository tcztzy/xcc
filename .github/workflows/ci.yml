name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Validation and handoff gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      XCC_LLC: /usr/bin/llc

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install compiler oracle tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Install uv
        run: python -m pip install uv

      - name: Install development environment
        run: uv sync --dev

      - name: Run compiler validation harness
        run: uv run python scripts/validate_compiler.py

      - name: Run test gates
        run: uv run tox -e py311,mypyc

      - name: Verify installed wheel and console entry point
        run: uv run tox -e package-smoke

      - name: Run lint gate
        run: uv run tox -e lint

      - name: Run type gate
        run: uv run tox -e type

  compatibility:
    name: CPython 3.14 core frontend compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Install development environment
        run: uv sync --dev

      - name: Run core frontend compatibility suite
        run: >-
          uv run python scripts/run_tests.py
          tests.test_options
          tests.test_data_layout
          tests.test_lexer
          tests.test_frontend
          tests.test_parser
          tests.test_preprocessor
          tests.test_sema
          --jobs 1 --quiet
