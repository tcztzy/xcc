[project]
name = "xcc"
version = "0.2.0a1"
description = "Agent-controlled Python 3.11+ C11 compiler with stdlib runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.scripts]
xcc = "xcc:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.14.0",
    "cython>=3.2.5",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocs-static-i18n>=1.3.1",
    "mypy[mypyc]>=2.1.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.13",
    "tox>=4.54.0",
    "tox-uv>=1.35.2",
    "ty>=0.0.38",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
extend-exclude = ["docs/_sources", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "scripts"]
exclude = [
    ".tox/**",
    ".venv/**",
    "build/**",
    "dist/**",
    "docs/_sources/**",
    "site/**",
]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
mypy_path = "src"
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 94.76
precision = 2

[tool.tox]
requires = ["tox>=4.54.0", "tox-uv>=1.35.2"]
env_list = ["py311", "py312", "py313", "py313t", "py314", "py314t", "pypy311", "mypyc", "lint", "type"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
dependency_groups = ["dev"]
commands = [["python", "scripts/run_tests.py", "--coverage", "--jobs", "1"]]

[tool.tox.env.lint]
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
package = "skip"
commands = [["ruff", "check", "src", "scripts"], ["ruff", "format", "--check", "src", "scripts"]]

[tool.tox.env.type]
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
package = "skip"
commands = [["ty", "check", "src", "scripts"], ["mypy"]]

[tool.tox.env.package-smoke]
runner = "uv-venv-lock-runner"
package = "wheel"
dependency_groups = []
no_default_groups = true
base_python = ["python3.11"]
commands = [["python", "scripts/validate_package.py"]]

[tool.tox.env.mypyc]
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
package = "skip"
base_python = ["python3.11"]
commands = [["python", "scripts/mypycize_xcc.py", "--build-root", "build/mypyc", "--clean", "--force"], ["python", "scripts/run_tests.py", "--pythonpath", "build/mypyc/lib", "--jobs", "1"]]

[tool.tox.env.cpython-build]
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
commands = [["python", "scripts/mypycize_xcc.py", "--build-root", "build/mypyc", "--clean", "--force"], ["python", "scripts/validate_cpython_build.py", "--clean", "--pythonpath", "build/mypyc/lib", "--cpython", "{posargs:../cpython}"]]

[tool.tox.env.bench-py311]
runner = "uv-venv-lock-runner"
package = "skip"
no_default_groups = true
base_python = ["python3.11"]
commands = [["python", "scripts/benchmark_xcc.py", "--variant", "pure", "--label", "py311", "--json", "build/benchmark/py311.json", "{posargs:}"]]

[tool.tox.env.bench-py312]
runner = "uv-venv-lock-runner"
package = "skip"
no_default_groups = true
base_python = ["python3.12"]
commands = [["python", "scripts/benchmark_xcc.py", "--variant", "pure", "--label", "py312", "--json", "build/benchmark/py312.json", "{posargs:}"]]

[tool.tox.env.bench-py313]
